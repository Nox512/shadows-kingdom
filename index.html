<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#080e1c">
<title>تحدي العباقرة — أرباح ومسابقات</title>

<style>
:root{
  --bg:#080e1c;
  --panel:#111d34;
  --gold:#ffe08a;
  --good:#5ef0c2;
  --bad:#ff5f78;
  --text:#f4f7ff;
  --muted:#aab8d2
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:radial-gradient(ellipse at 50% -10%,#354b76 0%,#111a30 42%,#080e1c 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif
}
body{padding:20px 14px}
.app{max-width:500px;margin:auto;padding-bottom:30px}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:20px
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:46px;height:46px;
  flex-shrink:0;
  border-radius:15px;
  background:linear-gradient(145deg,#fff0b0,#f4a64d 55%,#d77845);
  display:grid;place-items:center;
  color:#1b2234;font-size:25px;font-weight:bold
}
h1{font-size:21px;margin:0}
.subtitle{color:var(--muted);font-size:11px}
.pill{
  background:#1b2a43;
  border:1px solid #4b6285;
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  color:var(--gold);
  white-space:nowrap
}
.card{
  background:linear-gradient(145deg,#1c2d4bdf,#111c32f5);
  border:1px solid #50658a66;
  border-radius:22px;
  padding:20px;
  box-shadow:0 18px 45px #0004;
  margin-bottom:15px
}
.q-number{
  color:var(--gold);
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px
}
.question{
  font-size:18px;
  font-weight:bold;
  line-height:1.8;
  margin-bottom:20px
}
.options{display:grid;gap:10px}
.opt-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(145deg,#263957,#1c2b45);
  color:var(--text);
  border:1px solid #41577788;
  border-radius:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  text-align:right;
  transition:all .15s;
  line-height:1.6
}
.opt-btn:active{transform:scale(.98)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{
  background:linear-gradient(145deg,#17675d,#12473f);
  border-color:var(--good);
  color:var(--good)
}
.opt-btn.wrong{
  background:linear-gradient(145deg,#671725,#47121b);
  border-color:var(--bad);
  color:var(--bad)
}
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:15px;
  font-size:13px;
  color:var(--muted)
}
#nextBtn{
  display:none;
  background:var(--gold);
  color:#1b2234;
  border:0;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer
}
.ad-box{
  background:linear-gradient(145deg,#2a1f10,#3d2c14);
  border:1px solid #7a5c28;
  border-radius:16px;
  padding:15px;
  text-align:center;
  margin-top:15px
}
.ad-box p{
  margin:0 0 10px;
  font-size:12px;
  color:var(--gold);
  line-height:1.8
}
.ad-btn{
  background:linear-gradient(135deg,#ffe79a,#ffbf62);
  color:#242b3d;
  border:0;
  padding:10px 20px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer
}
.ad-btn:disabled{opacity:.6;cursor:default}
#feedback{
  margin-top:14px;
  font-size:14px;
  line-height:1.8;
  font-weight:bold
}
@media(max-width:360px){
  body{padding:14px 10px}
  .card{padding:15px}
  h1{font-size:18px}
  .pill{padding:7px 9px}
}
</style>
</head>

</div>

["ما العلم الذي يدرس أصل الكلمات وتطور معانيها؟",["علم الأصوات","علم الاشتقاق","علم البلاغة","علم العروض"],1]
];

const QUESTIONS = RAW_QUESTIONS.map(([q, options, answer]) => ({
  q,
  options,
  answer
}));

let currentIndex = 0;
let score = 0;
let answered = false;
let currentQuestion = null;
let adRewardClaimed = false;

const qNumEl = document.getElementById('qNum');
const qTextEl = document.getElementById('qText');
const optionsBox = document.getElementById('optionsBox');
const scoreEl = document.getElementById('score');
const progressText = document.getElementById('progressText');
const nextBtn = document.getElementById('nextBtn');
const adBtn = document.getElementById('adBtn');
const feedbackEl = document.getElementById('feedback');

function shuffleQuestion(question) {
  const options = question.options.map((text, index) => ({
    text,
    correct: index === question.answer
  }));

  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  return {
    q: question.q,
    options: options.map(option => option.text),
    answer: options.findIndex(option => option.correct)
  };
}

function loadQuestion() {
  answered = false;
  nextBtn.style.display = 'none';
  feedbackEl.textContent = '';

  currentQuestion = shuffleQuestion(QUESTIONS[currentIndex]);

  qNumEl.textContent =
    `السؤال ${currentIndex + 1} من ${QUESTIONS.length}`;

  qTextEl.textContent = currentQuestion.q;

  progressText.textContent =
    Math.round((currentIndex / QUESTIONS.length) * 100) + '%';

  optionsBox.innerHTML = '';

  currentQuestion.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = option;
    btn.onclick = () => checkAnswer(index, btn);
    optionsBox.appendChild(btn);
  });
}

function checkAnswer(selectedIndex, btn) {
  if (answered) return;
  answered = true;

  const allBtns = optionsBox.querySelectorAll('.opt-btn');
  const correctIndex = currentQuestion.answer;

  allBtns.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === correctIndex) {
    btn.classList.add('correct');
    score += 10;
    scoreEl.textContent = score;
    feedbackEl.textContent = 'إجابة صحيحة! +10 نقاط 🎉';
    feedbackEl.style.color = 'var(--good)';
  } else {
    btn.classList.add('wrong');
    allBtns[correctIndex].classList.add('correct');
    feedbackEl.textContent = 'إجابة خاطئة! الإجابة الصحيحة باللون الأخضر.';
    feedbackEl.style.color = 'var(--bad)';
  }

  progressText.textContent =
    Math.round(((currentIndex + 1) / QUESTIONS.length) * 100) + '%';

  nextBtn.textContent =
    currentIndex === QUESTIONS.length - 1
      ? 'عرض النتيجة'
      : 'السؤال التالي ←';

  nextBtn.style.display = 'block';
}

nextBtn.onclick = () => {
  currentIndex++;

  if (currentIndex < QUESTIONS.length) {
    loadQuestion();
    return;
  }

  showResults();
};

function showResults() {
  qNumEl.textContent = 'انتهى التحدي!';
  qTextEl.textContent =
    `حصلت على ${score} نقطة من أصل ${QUESTIONS.length * 10} نقطة.`;

  optionsBox.innerHTML = '';
  feedbackEl.textContent = 'يعطيك العافية! تقدر تعيد التحدي وتحاول تحسن نتيجتك.';
  feedbackEl.style.color = 'var(--gold)';

  const restartBtn = document.createElement('button');
  restartBtn.className = 'opt-btn';
  restartBtn.style.textAlign = 'center';
  restartBtn.textContent = 'إعادة اللعب ↺';
  restartBtn.onclick = restartGame;

  optionsBox.appendChild(restartBtn);
  progressText.textContent = '100%';
  nextBtn.style.display = 'none';
}

function restartGame() {
  currentIndex = 0;
  score = 0;
  scoreEl.textContent = '0';
  loadQuestion();
}

adBtn.onclick = () => {
  if (adRewardClaimed) {
    alert('حصلت على المكافأة التجريبية بالفعل.');
    return;
  }

  adRewardClaimed = true;
  score += 50;
  scoreEl.textContent = score;
  adBtn.disabled = true;
  adBtn.textContent = 'تمت إضافة 50 نقطة';
  alert('تمت إضافة 50 نقطة تجريبية إلى رصيدك.');
};

loadQuestion();
</script>
</body>
</html>
