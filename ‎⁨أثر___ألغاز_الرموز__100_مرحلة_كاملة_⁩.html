<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>أثَــر — ألغاز الرموز</title>
<style>
:root {
  --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 50%, #090d16 100%);
  --panel: rgba(30, 41, 59, 0.75);
  --panel-border: rgba(100, 116, 139, 0.3);
  --gold: #fbbf24;
  --gold-glow: rgba(251, 191, 36, 0.35);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --good: #34d399;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Cairo", sans-serif;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body {
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  touch-action: manipulation;
}

.app-container {
  max-width: 620px;
  margin: 0 auto;
  padding: 12px 0 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 2px;
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  display: grid;
  place-items: center;
  font-size: 26px;
  color: #0f172a;
  box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
}
h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.header-actions { display: flex; align-items: center; gap: 8px; }
.pill-badge {
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid var(--panel-border);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.level-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.chapter-title { color: var(--gold); font-size: 12px; font-weight: 700; }
.level-title { font-size: 20px; font-weight: 800; margin: 2px 0 4px; }
.level-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.stat-box {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
.stat-box b { display: block; font-size: 18px; font-weight: 800; color: #f1f5f9; }
.stat-box span { font-size: 10px; color: var(--text-muted); }

.progress-bar-bg {
  height: 6px;
  background: rgba(15, 23, 42, 0.8);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, var(--gold));
  width: 0%;
  transition: width 0.3s ease;
  box-shadow: 0 0 10px var(--gold-glow);
}

.board-container {
  padding: 10px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  position: relative;
  touch-action: none;
}
.board {
  display: grid;
  gap: 5px;
  width: 100%;
  aspect-ratio: 1;
}

.cell {
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.15s ease, transform 0.1s ease;
}
.cell.endpoint {
  background: rgba(15, 23, 42, 0.9);
  box-shadow: inset 0 0 0 3px var(--c), 0 0 15px color-mix(in srgb, var(--c) 40%, transparent);
}
.cell.path {
  background: var(--c);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3), 0 0 12px color-mix(in srgb, var(--c) 30%, transparent);
  transform: scale(0.96);
}
.cell.filled:not(.endpoint)::after {
  content: "";
  width: 28%;
  height: 28%;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
}
.cell.hint { animation: pulseHint 0.6s ease-in-out 3; }
@keyframes pulseHint { 50% { transform: scale(0.82); filter: brightness(1.8); } }

.glyph {
  font-size: clamp(14px, 4vw, 24px);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

.color-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.legend-tag {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.controls-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
button {
  font-family: inherit;
  border: 0;
  border-radius: 12px;
  padding: 12px 6px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
  touch-action: manipulation;
}
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #0f172a;
  box-shadow: 0 4px 15px var(--gold-glow);
}
.btn-secondary {
  background: rgba(30, 41, 59, 0.9);
  color: #f1f5f9;
  border: 1px solid var(--panel-border);
}
.btn-icon {
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
}

.status-message {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
}
.status-message.success { color: var(--good); font-weight: 700; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.section-head h2 { font-size: 14px; font-weight: 800; }

.levels-container {
  max-height: 240px;
  overflow-y: auto;
  padding-right: 4px;
}
.levels-container::-webkit-scrollbar { width: 5px; }
.levels-container::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }

.levels-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.level-node {
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 10px 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}
.level-node.unlocked { background: rgba(30, 41, 59, 0.9); border-color: var(--panel-border); color: #f1f5f9; }
.level-node.done { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
.level-node.current { outline: 2px solid var(--gold); color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(9, 13, 22, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.modal-overlay.active { display: flex; }
.modal-card {
  width: 100%;
  max-width: 320px;
  background: #0f172a;
  border: 1px solid var(--panel-border);
  border-radius: 24px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
}
.modal-card h3 { font-size: 22px; margin: 10px 0 6px; }
.modal-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.6; }

@media (min-width: 520px) {
  .levels-grid { grid-template-columns: repeat(8, 1fr); }
  .card { padding: 20px; }
}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand-group">
      <div class="brand-icon">✦</div>
      <div>
        <h1>أثَــر</h1>
        <div class="subtitle">ألغاز الرموز • 100 مرحلة</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="soundBtn">🔊 الصوت</button>
      <div class="pill-badge">✧ <span id="starCounter">0</span></div>
    </div>
  </header>

  <section class="card">
    <div class="level-meta">
      <div>
        <div class="chapter-title" id="chapterName">الفصل الأول</div>
        <div class="level-title" id="levelTitle">المرحلة 1</div>
      </div>
      <div class="pill-badge" id="levelProgressBadge">1 / 100</div>
    </div>
    <div class="level-desc" id="levelDesc">صِل كل رمز بالنواة المماثلة، وغطّ جميع مربعـات اللوحة كاملة.</div>
    <div class="stats-grid">
      <div class="stat-box"><b id="pairsCount">2</b><span>أزواج الرموز</span></div>
      <div class="stat-box"><b id="movesCount">0</b><span>حركاتك</span></div>
      <div class="stat-box"><b id="bestScore">—</b><span>أفضل نتيجة</span></div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="overallProgressBar"></div></div>
  </section>

  <section class="card">
    <div class="board-container">
      <div class="board" id="gameBoard"></div>
    </div>
    <div class="color-legend" id="colorLegend"></div>
    <div class="controls-row">
      <button class="btn-secondary" id="resetBtn">↻ إعادة</button>
      <button class="btn-secondary" id="hintBtn">✦ تلميح (<span id="hintsCount">3</span>)</button>
      <button class="btn-primary" id="nextBtn" disabled>التالي ←</button>
    </div>
    <div class="status-message" id="statusMessage">اسحب من رمز إلى نظيره لتوصيل المسار.</div>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>خريطة المراحل (100)</h2>
    </div>
    <div class="levels-container">
      <div class="levels-grid" id="levelsGrid"></div>
    </div>
  </section>
</div>

<div class="modal-overlay" id="victoryModal">
  <div class="modal-card">
    <div style="font-size: 48px; color: var(--gold);">✦</div>
    <h3>اكتمل الأثر!</h3>
    <p id="modalDescription">نجحت في تغطية اللوحة كاملة وحل اللغز بنجاح.</p>
    <button class="btn-primary" id="modalNextBtn" style="width: 100%;">المرحلة التالية ←</button>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const COLOR_PALETTE = [
    { name: 'الزمرد', color: '#10b981', glyph: '✦' },
    { name: 'الياقوت', color: '#f43f5e', glyph: '◆' },
    { name: 'السيان', color: '#06b6d4', glyph: '●' },
    { name: 'العنبر', color: '#f59e0b', glyph: '★' },
    { name: 'الأرجوان', color: '#a855f7', glyph: '⬟' },
    { name: 'الوردي', color: '#ec4899', glyph: '✿' },
    { name: 'المرجان', color: '#ff7043', glyph: '▲' },
    { name: 'الفيزياء', color: '#3b82f6', glyph: '◈' }
  ];

  const CHAPTERS = [
    "الفصل الأول: الاستيقاظ",
    "الفصل الثاني: أطلال الحراس",
    "الفصل الثالث: الكهف المنسي",
    "الفصل الرابع: قلب المملكة",
    "الفصل الخامس: ما وراء الظلال",
    "الفصل السادس: الأختام القديمة",
    "الفصل السابع: ممرات الأثير",
    "الفصل الثامن: شفق الأساطير",
    "الفصل التاسع: صدى الفراغ",
    "الفصل العاشر: الأثر الأبدي"
  ];

  function seededRandom(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function() { return (s = s * 16807 % 2147483647) / 2147483647; };
  }

  function createBoardPath(dim, pairCount, rng) {
    const grid = Array.from({ length: dim }, () => Array(dim).fill(-1));
    const available = [];
    for (let r = 0; r < dim; r++) {
      for (let c = 0; c < dim; c++) available.push([r, c]);
    }

    const paths = Array.from({ length: pairCount }, () => []);
    let unassigned = dim * dim;

    for (let p = 0; p < pairCount; p++) {
      if (available.length === 0) break;
      const idx = Math.floor(rng() * available.length);
      const [r, c] = available.splice(idx, 1)[0];
      grid[r][c] = p;
      paths[p].push([r, c]);
      unassigned--;
    }

    const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    let iterations = dim * dim * 12;

    while (unassigned > 0 && iterations > 0) {
      iterations--;
      const p = Math.floor(rng() * pairCount);
      if (paths[p].length === 0) continue;

      const useHead = rng() > 0.5;
      const [cr, cc] = useHead ? paths[p][paths[p].length - 1] : paths[p][0];

      const validNeighbors = [];
      for (const [dr, dc] of dirs) {
        const nr = cr + dr, nc = cc + dc;
        if (nr >= 0 && nr < dim && nc >= 0 && nc < dim && grid[nr][nc] === -1) {
          validNeighbors.push([nr, nc]);
        }
      }

      if (validNeighbors.length > 0) {
        const [nr, nc] = validNeighbors[Math.floor(rng() * validNeighbors.length)];
        grid[nr][nc] = p;
        if (useHead) paths[p].push([nr, nc]);
        else paths[p].unshift([nr, nc]);
        unassigned--;
      }
    }

    const resultPairs = [];
    for (let p = 0; p < pairCount; p++) {
      if (paths[p].length >= 2) {
        const head = paths[p][0];
        const tail = paths[p][paths[p].length - 1];
        resultPairs.push([head[0], head[1], tail[0], tail[1]]);
      }
    }

    if (unassigned > 0 || resultPairs.length < 2) return null;
    return { w: dim, h: dim, pairs: resultPairs };
  }

  function generate100Levels() {
    const levels = [];
    for (let i = 0; i < 100; i++) {
      const rng = seededRandom((i + 1) * 9999 + 123);
      let dim = 5;
      if (i >= 12) dim = 6;
      if (i >= 30) dim = 7;
      if (i >= 50) dim = 8;
      if (i >= 72) dim = 9;
      if (i >= 88) dim = 10;

      let pairCount = 2;
      if (i >= 8) pairCount = 3;
      if (i >= 20) pairCount = 4;
      if (i >= 40) pairCount = 5;
      if (i >= 65) pairCount = 6;
      if (i >= 82) pairCount = 7;
      if (i >= 94) pairCount = 8;

      let boardData = createBoardPath(dim, pairCount, rng);
      let retries = 0;
      while (!boardData && retries < 40) {
        retries++;
        boardData = createBoardPath(dim, pairCount, rng);
      }

      if (!boardData) {
        boardData = { w: dim, h: dim, pairs: [[0,0, dim-1,0], [0,dim-1, dim-1,dim-1]] };
      }

      const chapIdx = Math.min(Math.floor(i / 10), CHAPTERS.length - 1);
      levels.push({
        id: i + 1,
        title: `المرحلة ${i + 1}`,
        chapter: CHAPTERS[chapIdx],
        w: boardData.w,
        h: boardData.h,
        pairs: boardData.pairs
      });
    }
    return levels;
  }

  const ALL_LEVELS = generate100Levels();

  let currentLevelIdx = 0;
  let userPaths = {};
  let activeDrawing = null;
  let moveCounter = 0;
  let hintTokens = 3;
  let unlockedLevel = 1;
  let completedLevels = {};
  let isAudioEnabled = true;
  let audioCtx = null;

  const $ = id => document.getElementById(id);
  const posKey = (r, c) => `${r},${c}`;

  function playAudio(type) {
    if (!isAudioEnabled) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      let freq = 350;
      if (type === 'connect') freq = 520;
      if (type === 'win') freq = 680;
      if (type === 'tap') freq = 400;

      osc.type = type === 'win' ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * (type === 'win' ? 1.4 : 0.8), now + 0.15);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.start(now);
      osc.stop(now + 0.19);
    } catch (e) {}
  }

  const STORAGE_KEY = 'athar_100_levels_save';
  function loadProgress() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      unlockedLevel = Math.max(1, Math.min(ALL_LEVELS.length, data.unlocked || 1));
      completedLevels = data.completed || {};
      hintTokens = data.hints ?? 3;
    } catch (e) {}
  }
  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        unlocked: unlockedLevel,
        completed: completedLevels,
        hints: hintTokens
      }));
    } catch (e) {}
  }

  function getLevelEndpoints(level) {
    const map = {};
    level.pairs.forEach((pair, idx) => {
      const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
      map[posKey(pair[0], pair[1])] = { pairIdx: idx, ...color };
      map[posKey(pair[2], pair[3])] = { pairIdx: idx, ...color };
    });
    return map;
  }

  function initBoard() {
    const level = ALL_LEVELS[currentLevelIdx];
    userPaths = {};
    level.pairs.forEach((_, idx) => userPaths[idx] = []);
    moveCounter = 0;
    activeDrawing = null;
    renderUI();
  }

  function renderUI() {
    const level = ALL_LEVELS[currentLevelIdx];
    $('chapterName').textContent = level.chapter;
    $('levelTitle').textContent = level.title;
    $('levelProgressBadge').textContent = `${currentLevelIdx + 1} / ${ALL_LEVELS.length}`;
    $('pairsCount').textContent = level.pairs.length;
    $('movesCount').textContent = moveCounter;
    $('bestScore').textContent = completedLevels[currentLevelIdx + 1] ? '★'.repeat(completedLevels[currentLevelIdx + 1]) : '—';
    $('starCounter').textContent = Object.values(completedLevels).reduce((a, b) => a + b, 0);
    $('hintsCount').textContent = hintTokens;
    $('overallProgressBar').style.width = `${(Object.keys(completedLevels).length / ALL_LEVELS.length) * 100}%`;
    $('nextBtn').disabled = !completedLevels[currentLevelIdx + 1] || currentLevelIdx >= ALL_LEVELS.length - 1;

    const boardEl = $('gameBoard');
    boardEl.style.gridTemplateColumns = `repeat(${level.w}, 1fr)`;
    boardEl.innerHTML = '';

    const endpointsMap = getLevelEndpoints(level);
    const cellMap = {};

    for (let r = 0; r < level.h; r++) {
      for (let c = 0; c < level.w; c++) {
        const k = posKey(r, c);
        const ep = endpointsMap[k];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.k = k;
        if (ep) {
          cell.classList.add('endpoint');
          cell.style.setProperty('--c', ep.color);
          cell.innerHTML = `<span class="glyph">${ep.glyph}</span>`;
        }
        boardEl.appendChild(cell);
        cellMap[k] = cell;
      }
    }

    for (const [pIdx, path] of Object.entries(userPaths)) {
      const color = COLOR_PALETTE[Number(pIdx) % COLOR_PALETTE.length];
      path.forEach(k => {
        const cell = cellMap[k];
        if (cell && !cell.classList.contains('endpoint')) {
          cell.classList.add('path', 'filled');
          cell.style.setProperty('--c', color.color);
        }
      });
    }

    const legendEl = $('colorLegend');
    legendEl.innerHTML = '';
    level.pairs.forEach((_, idx) => {
      const c = COLOR_PALETTE[idx % COLOR_PALETTE.length];
      const item = document.createElement('div');
      item.className = 'legend-tag';
      item.innerHTML = `<span class="legend-dot" style="background:${c.color}"></span>${c.name}`;
      legendEl.appendChild(item);
    });

    const levelsGrid = $('levelsGrid');
    levelsGrid.innerHTML = '';
    ALL_LEVELS.forEach((lv, idx) => {
      const btn = document.createElement('button');
      btn.className = 'level-node' +
        ((idx + 1) <= unlockedLevel ? ' unlocked' : '') +
        (completedLevels[idx + 1] ? ' done' : '') +
        (idx === currentLevelIdx ? ' current' : '');
      btn.textContent = idx + 1;
      btn.disabled = (idx + 1) > unlockedLevel;
      btn.onclick = () => { currentLevelIdx = idx; initBoard(); };
      levelsGrid.appendChild(btn);
    });

    $('statusMessage').textContent = 'اسحب من رمز إلى نظيره، وغطّ اللوحة كاملة.';
    $('statusMessage').className = 'status-message';
  }

  function findPathAtKey(k) {
    for (const id in userPaths) {
      if (userPaths[id].includes(k)) return Number(id);
    }
    return null;
  }

  function startPathAt(k) {
    const level = ALL_LEVELS[currentLevelIdx];
    const endpoints = getLevelEndpoints(level);
    const ep = endpoints[k];
    if (!ep) return;

    playAudio('tap');
    activeDrawing = { pairIdx: ep.pairIdx, lastKey: k };
    userPaths[ep.pairIdx] = [k];
    moveCounter++;
    renderUI();
    activeDrawing = { pairIdx: ep.pairIdx, lastKey: k };
  }

  function extendPathTo(k) {
    if (!activeDrawing || k === activeDrawing.lastKey) return;
    const [r, c] = k.split(',').map(Number);
    const [pr, pc] = activeDrawing.lastKey.split(',').map(Number);
    if (Math.abs(r - pr) + Math.abs(c - pc) !== 1) return;

    const level = ALL_LEVELS[currentLevelIdx];
    const endpoints = getLevelEndpoints(level);
    const targetEp = endpoints[k];

    if (targetEp && targetEp.pairIdx === activeDrawing.pairIdx && k !== userPaths[activeDrawing.pairIdx][0]) {
      userPaths[activeDrawing.pairIdx].push(k);
      activeDrawing.lastKey = k;
      playAudio('connect');
      checkBoardCompletion();
      return;
    }

    if (targetEp && targetEp.pairIdx !== activeDrawing.pairIdx) return;

    const occupiedBy = findPathAtKey(k);
    if (occupiedBy !== null && occupiedBy !== activeDrawing.pairIdx) return;

    const currentPath = userPaths[activeDrawing.pairIdx];
    const existingIdx = currentPath.indexOf(k);
    if (existingIdx >= 0) {
      currentPath.splice(existingIdx + 1);
      activeDrawing.lastKey = k;
      renderUI();
      return;
    }

    currentPath.push(k);
    activeDrawing.lastKey = k;
    renderUI();
    activeDrawing = { pairIdx: activeDrawing.pairIdx, lastKey: k };
  }

  function checkBoardCompletion() {
    const level = ALL_LEVELS[currentLevelIdx];
    activeDrawing = null;
    renderUI();

    const allConnected = level.pairs.every((pair, idx) => {
      const p = userPaths[idx];
      if (p.length < 2) return false;
      const start = p[0], end = p[p.length - 1];
      const k1 = posKey(pair[0], pair[1]), k2 = posKey(pair[2], pair[3]);
      return (start === k1 && end === k2) || (start === k2 && end === k1);
    });

    if (!allConnected) return;

    const coveredCount = new Set(Object.values(userPaths).flat()).size;
    const totalCells = level.w * level.h;
    const missing = totalCells - coveredCount;

    if (missing > 0) {
      $('statusMessage').textContent = `وصلت الألوان! يتبقى ${missing} خلية فارغة لتغطية اللوحة.`;
      playAudio('connect');
      return;
    }

    const stars = moveCounter <= level.pairs.length + 2 ? 3 : (moveCounter <= level.pairs.length * 2 ? 2 : 1);
    completedLevels[currentLevelIdx + 1] = Math.max(completedLevels[currentLevelIdx + 1] || 0, stars);
    unlockedLevel = Math.max(unlockedLevel, Math.min(ALL_LEVELS.length, currentLevelIdx + 2));
    saveProgress();
    renderUI();

    playAudio('win');
    $('modalDescription').textContent = `أنهيت ${level.title} من ${level.chapter} في ${moveCounter} حركة!`;
    $('victoryModal').classList.add('active');
  }

  let isPointerDown = false;
  let lastHoveredKey = null;
  const boardElement = $('gameBoard');

  function getCellFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.cell') : null;
  }

  boardElement.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    e.preventDefault();
    isPointerDown = true;
    lastHoveredKey = cell.dataset.k;
    startPathAt(lastHoveredKey);
  });

  boardElement.addEventListener('pointermove', e => {
    if (!isPointerDown || !activeDrawing) return;
    e.preventDefault();
    const cell = getCellFromPoint(e.clientX, e.clientY);
    if (cell && cell.dataset.k !== lastHoveredKey) {
      extendPathTo(cell.dataset.k);
      lastHoveredKey = cell.dataset.k;
    }
  });

  function handlePointerUp() {
    isPointerDown = false;
    lastHoveredKey = null;
    if (activeDrawing) {
      activeDrawing = null;
      renderUI();
    }
  }

  boardElement.addEventListener('pointerup', handlePointerUp);
  boardElement.addEventListener('pointercancel', handlePointerUp);

  $('resetBtn').onclick = () => initBoard();
  $('nextBtn').onclick = () => {
    if (currentLevelIdx < ALL_LEVELS.length - 1) {
      currentLevelIdx++;
      initBoard();
    }
  };
  $('modalNextBtn').onclick = () => {
    $('victoryModal').classList.remove('active');
    if (currentLevelIdx < ALL_LEVELS.length - 1) {
      currentLevelIdx++;
      initBoard();
    }
  };
  $('hintBtn').onclick = () => {
    if (hintTokens <= 0) {
      $('statusMessage').textContent = 'نفدت التلميحات المتاحة.';
      return;
    }
    const level = ALL_LEVELS[currentLevelIdx];
    const targetPairIdx = Object.keys(userPaths).find(idx => userPaths[idx].length === 0);
    if (targetPairIdx === undefined) {
      $('statusMessage').textContent = 'أعد رسم المسارات لرؤية التلميح.';
      return;
    }

    hintTokens--;
    saveProgress();
    renderUI();

    const pair = level.pairs[+targetPairIdx];
    [posKey(pair[0], pair[1]), posKey(pair[2], pair[3])].forEach(k => {
      const cell = boardElement.querySelector(`[data-k="${k}"]`);
      if (cell) {
        cell.classList.add('hint');
        setTimeout(() => cell.classList.remove('hint'), 1800);
      }
    });
    $('statusMessage').textContent = 'ركز على الرمزين المضيئين.';
  };

  $('soundBtn').onclick = () => {
    isAudioEnabled = !isAudioEnabled;
    $('soundBtn').textContent = isAudioEnabled ? '🔊 الصوت' : '🔇 صامت';
    if (isAudioEnabled) playAudio('tap');
  };

  loadProgress();
  initBoard();
});
</script>
</body>
</html>
