<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080e1c">
<title>تحدي العباقرة — 100 سؤال صعبة</title>
<style>
:root{--bg:#080e1c;--panel:#111d34;--gold:#ffe08a;--good:#5ef0c2;--bad:#ff5f78;--text:#f4f7ff;--muted:#aab8d2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#354b76 0%,#111a30 42%,#080e1c 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:20px 14px}
.app{max-width:550px;margin:auto;padding-bottom:30px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#fff0b0,#f4a64d 55%,#d77845);display:grid;place-items:center;color:#1b2234;font-size:25px;font-weight:bold}
h1{font-size:20px;margin:0}
.subtitle{color:var(--muted);font-size:11px}
.header-actions{display:flex;gap:8px;align-items:center}
.pill{background:#1b2a43;border:1px solid #4b6285;padding:8px 12px;border-radius:999px;font-size:12px;color:var(--gold);font-weight:bold}
.rules-btn{background:#1b2a43;border:1px solid #4b6285;padding:8px 12px;border-radius:999px;font-size:12px;color:var(--text);cursor:pointer;font-weight:bold}
.card{background:linear-gradient(145deg,#1c2d4bdf,#111c32f5);border:1px solid #50658a66;border-radius:22px;padding:22px;box-shadow:0 18px 45px #0004;margin-bottom:15px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-number{color:var(--gold);font-size:13px;font-weight:bold}
.streak-badge{background:rgba(255,224,138,0.15);color:var(--gold);padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold;display:none}
.progress-bar-bg{width:100%;height:8px;background:#17253e;border-radius:99px;margin-bottom:18px;overflow:hidden}
.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#f4a64d,var(--gold));transition:width 0.3s ease}
.question{font-size:18px;font-weight:bold;line-height:1.6;margin-bottom:20px}
.options{display:grid;gap:12px}
.opt-btn{width:100%;padding:14px 16px;background:linear-gradient(145deg,#263957,#1c2b45);color:var(--text);border:1px solid #41577788;border-radius:14px;font-size:15px;font-weight:bold;cursor:pointer;text-align:right;transition:all .15s}
.opt-btn:active{transform:scale(0.98)}
.opt-btn.correct{background:linear-gradient(145deg,#17675d,#12473f);border-color:var(--good);color:var(--good)}
.opt-btn.wrong{background:linear-gradient(145deg,#671725,#47121b);border-color:var(--bad);color:var(--bad)}
.stats{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:13px;color:var(--muted)}
.feedback{font-size:14px;font-weight:bold;margin-top:12px;min-height:22px}
.feedback.bad{color:var(--bad)}
.feedback.good{color:var(--good)}

/* Modal Popup */
.modal{position:fixed;inset:0;background:#080d18c9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-box{max-width:400px;width:100%;background:#1b2944;border:1px solid #455a7e;border-radius:22px;padding:22px;text-align:right;box-shadow:0 24px 80px #0008}
