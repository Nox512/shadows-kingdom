<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080e1c">
<title>تحدي العباقرة — أرباح ومسابقات</title>
<style>
:root{--bg:#080e1c;--panel:#111d34;--gold:#ffe08a;--good:#5ef0c2;--bad:#ff5f78;--text:#f4f7ff;--muted:#aab8d2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#354b76 0%,#111a30 42%,#080e1c 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:20px 14px}
.app{max-width:500px;margin:auto;padding-bottom:30px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#fff0b0,#f4a64d 55%,#d77845);display:grid;place-items:center;color:#1b2234;font-size:25px;font-weight:bold}
h1{font-size:21px;margin:0}.subtitle{color:var(--muted);font-size:11px}
.pill{background:#1b2a43;border:1px solid #4b6285;padding:8px 12px;border-radius:999px;font-size:12px;color:var(--gold)}
.card{background:linear-gradient(145deg,#1c2d4bdf,#111c32f5);border:1px solid #50658a66;border-radius:22px;padding:20px;box-shadow:0 18px 45px #0004;margin-bottom:15px}
.q-number{color:var(--gold);font-size:12px;font-weight:bold;margin-bottom:8px}
.question{font-size:18px;font-weight:bold;line-height:1.6;margin-bottom:20px}
.options{display:grid;gap:10px}
.opt-btn{width:100%;padding:14px;background:linear-gradient(145deg,#263957,#1c2b45);color:var(--text);border:1px solid #41577788;border-radius:14px;font-size:15px;font-weight:bold;cursor:pointer;text-align:right;transition:all .15s}
.opt-btn:active{transform:scale(0.98)}
.opt-btn.correct{background:linear-gradient(145deg,#17675d,#12473f);border-color:var(--good);color:var(--good)}
.opt-btn.wrong{background:linear-gradient(145deg,#671725,#47121b);border-color:var(--bad);color:var(--bad)}
.stats{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:13px;color:var(--muted)}
.ad-box{background:linear-gradient(145deg,#2a1f10,#3d2c14);border:1px solid #7a5c28;border-radius:16px;padding:15px;text-align:center;margin-top:15px}
.ad-box p{margin:0 0 10px;font-size:12px;color:var(--gold)}
.ad-btn{background:linear-gradient(135deg,#ffe79a,#ffbf62);color:#242b3d;border:0;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">💡</div><div><h1>تحدي العباقرة</h1><div class="subtitle">أسئلة وألغاز • أرباح حقيقية</div></div></div>
  <div class="pill">🏆 النقاط: <span id="score">0</span></div>
</header>

<section class="card">
  <div class="q-number" id="qNum">السؤال 1 من 5</div>
  <div class="question" id="qText">جاري تحميل السؤال...</div>
  <div class="options" id="optionsBox"></div>
  <div class="stats">
    <span>التقدم: <span id="progressText">20%</span></span>
    <button id="nextBtn" style="display:none;background:var(--gold);border:0;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer">السؤال التالي ←</button>
  </div>
</section>

<section class="ad-box">
  <p>📺 نموذج ربحي (إعلان مكافأة): هل تحتاج مساعدة أو تلميح؟</p>
  <button class="ad-btn" id="adBtn">مشاهدة إعلان (+50 نقطة)</button>
</section>
</div>

<script>
const QUESTIONS = [
  {
    q: "ما هو الحيوان الذي يُسمى 'سفينة الصحراء'؟",
    options: ["الحصان", "الجمل", "الفيل", "الأسد"],
    answer: 1
  },
  {
    q: "كم عدد سور القرآن الكريم؟",
    options: ["112 سورة", "114 سورة", "120 سورة", "110 سورة"],
    answer: 1
  },
  {
    q: "ما هي عاصمة المملكة العربية السعودية؟",
    options: ["جدة", "الدمام", "الرياض", "مكة المكرمة"],
    answer: 2
  },
  {
    q: "أي من هذه العناصر يعتبر معدناً سائلاً في درجة الحرارة العادية؟",
    options: ["الزئبق", "الحديد", "الذهب", "النحاس"],
    answer: 0
  },
  {
    q: "ما هو أكبر كوكب في المجموعة الشمسية؟",
    options: ["المريخ", "زحل", "المشتري", "الأرض"],
    answer: 2
  }
];

let currentIndex = 0;
let score = 0;
let answered = false;

const qNumEl = document.getElementById('qNum');
const qTextEl = document.getElementById('qText');
const optionsBox = document.getElementById('optionsBox');
const scoreEl = document.getElementById('score');
const progressText = document.getElementById('progressText');
const nextBtn = document.getElementById('nextBtn');
const adBtn = document.getElementById('adBtn');

function loadQuestion() {
  answered = false;
  nextBtn.style.display = 'none';
  const current = QUESTIONS[currentIndex];
  
  qNumEl.textContent = `السؤال ${currentIndex + 1} من ${QUESTIONS.length}`;
  qTextEl.textContent = current.q;
  progressText.textContent = Math.round(((currentIndex) / QUESTIONS.length) * 100) + '%';
  
  optionsBox.innerHTML = '';
  current.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(idx, btn);
    optionsBox.appendChild(btn);
  });
}

function checkAnswer(selectedIdx, btn) {
  if (answered) return;
  answered = true;
  
  const current = QUESTIONS[currentIndex];
  const allBtns = optionsBox.querySelectorAll('.opt-btn');
  
  if (selectedIdx === current.answer) {
    btn.classList.add('correct');
    score += 10;
    scoreEl.textContent = score;
  } else {
    btn.classList.add('wrong');
    allBtns[current.answer].classList.add('correct');
  }
  
  nextBtn.style.display = 'block';
}

nextBtn.onclick = () => {
  currentIndex++;
  if (currentIndex < QUESTIONS.length) {
    loadQuestion();
  } else {
    qNumEl.textContent = "انتهى التحدي!";
    qTextEl.textContent = `أمبرك! جمعت ${score} نقطة بنجاح. 🎉`;
    optionsBox.innerHTML = '<button class="opt-btn" style="text-align:center" onclick="restartGame()">إعادة اللعب ↺</button>';
    nextBtn.style.display = 'none';
    progressText.textContent = '100%';
  }
};

window.restartGame = function() {
  currentIndex = 0;
  score = 0;
  scoreEl.textContent = score;
  loadQuestion();
};

// محاكاة إعلان المكافأة للأرباح
adBtn.onclick = () => {
  adBtn.disabled = true;
  adBtn.textContent = "جاري تشغيل الإعلان...";
  setTimeout(() => {
    score += 50;
    scoreEl.textContent = score;
    alert("مبروك! شاهدت الإعلان وحصلت على مكافأة 50 نقطة.");
    adBtn.disabled = false;
    adBtn.textContent = "مشاهدة إعلان (+50 نقطة)";
  }, 1500);
};

loadQuestion();
</script>
</body>
</html>
