<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14251f">
<title>ظلال المملكة المنسية</title>
<style>
:root{--glass:rgba(14,26,25,.78);--line:rgba(220,239,211,.22);--gold:#f3ca76}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9dc7c0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#9ecdc7,#314c43);z-index:10;text-align:center;padding:24px}
.loadbox{background:#12231edb;border:1px solid #ffffff30;border-radius:20px;padding:24px;max-width:340px}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.panel{background:var(--glass);border:1px solid var(--line);box-shadow:0 6px 24px #07100b35;backdrop-filter:blur(8px);border-radius:14px}
#playerPanel{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:min(230px,60vw);padding:10px 12px}
.name{font-size:13px;font-weight:800;color:#f5e6bd;display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:#ffffff22;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:100%;border-radius:99px;transition:width .18s}
#hpFill{background:linear-gradient(90deg,#d95045,#ff8c65)}#xpFill{background:linear-gradient(90deg,#4cc6a0,#b1e987)}
#stats{font-size:11px;color:#d8e3d8;margin-top:6px;display:flex;justify-content:space-between}
#quest{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;padding:9px 12px;max-width:45vw;font-size:12px;line-height:1.5}
#quest b{color:var(--gold);display:block}
#hint{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#14251fd9;border:1px solid #ffffff25;border-radius:99px;padding:7px 13px;font-size:12px;white-space:nowrap;transition:opacity .5s}
#toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);background:#172a22e8;border:1px solid #e8d29c66;border-radius:12px;padding:10px 15px;font-size:13px;opacity:0;transition:opacity .2s;white-space:nowrap}
#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;gap:12px}
#joystick{width:124px;height:124px;border-radius:50%;background:#10231d55;border:2px solid #e8f1dc70;position:relative;pointer-events:auto;touch-action:none;flex-shrink:0}
#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#e4e8d2,#9eb5a1);border:2px solid #ffffff9c;box-shadow:0 3px 12px #0005}
#actions{display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto;align-items:end}
.act{border:1px solid #ffffff65;border-radius:50%;width:70px;height:70px;color:white;font-weight:800;font-size:12px;background:linear-gradient(145deg,#344f43eF,#142a24ed);box-shadow:0 5px 12px #0004;touch-action:none}
.act:active{transform:scale(.94);filter:brightness(1.25)}
#attack{width:82px;height:82px;background:linear-gradient(145deg,#bd7845,#753e2b);border-color:#ffdfa0}
#dodge{background:linear-gradient(145deg,#547c8a,#244653)}
#heal{background:linear-gradient(145deg,#588d63,#2c513c)}
#cam{position:absolute;right:14px;bottom:170px;pointer-events:auto;border:1px solid #ffffff55;background:#14251fa8;color:white;border-radius:12px;padding:9px 11px;font-size:11px}
#dead{position:fixed;inset:0;background:#07110ed9;display:none;align-items:center;justify-content:center;z-index:5;text-align:center;padding:24px}
#dead .panel{padding:24px;max-width:320px;pointer-events:auto}
#dead button{background:#d8b86d;border:0;border-radius:10px;padding:12px 22px;font-weight:800;color:#1d2a21}
@media(min-width:700px){#joystick{width:140px;height:140px}#stick{width:56px;height:56px}#actions{grid-template-columns:repeat(2,82px)}.act{width:82px;height:82px}#attack{width:94px;height:94px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="loadbox"><div style="font-size:34px">🌿 ⚔️</div><h2 style="margin:8px 0;color:#f2d28c">ظلال المملكة المنسية</h2><p id="loadmsg">يتم تجهيز الغابة...</p><small style="color:#b8cbbd">تحتاج اللعبة إلى اتصال بالإنترنت لتحميل محرك الرسوم.</small></div></div>
<div id="hud" style="display:none">
 <div id="playerPanel" class="panel"><div class="name"><span>المحارب</span><span id="level">المستوى 1</span></div><div class="bar"><i id="hpFill"></i></div><div class="bar"><i id="xpFill"></i></div><div id="stats"><span id="hpText">100 / 100 صحة</span><span id="gold">0 ذهب</span></div></div>
 <div id="quest" class="panel"><b>مهمة الغابة</b><span id="questText">اهزم الوحوش القريبة (0/3)</span></div>
 <div id="hint">حرّك العصا للمشي • المس الهجوم لضرب أقرب عدو</div><div id="toast"></div>
 <div id="bottom"><div id="joystick"><div id="stick"></div></div><div id="actions"><button class="act" id="dodge">مراوغة</button><button class="act" id="attack">⚔️<br>هجوم</button><button class="act" id="heal">علاج</button><button class="act" id="heavy">ضربة ثقيلة</button></div></div>
 <button id="cam">تدوير الكاميرا ↻</button>
</div>
<div id="dead"><div class="panel"><div style="font-size:38px">🛡️</div><h2>سقط المحارب</h2><p>استعد قواك وحاول من جديد.</p><button id="restart">إعادة المحاولة</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const $=id=>document.getElementById(id);
const loading=$('loading'), hud=$('hud');
if(!window.THREE){$('loadmsg').textContent='تعذر تحميل الرسومات. تأكد من الإنترنت ثم حدّث الصفحة.';return;}
let scene,camera,renderer,clock,player, sword, world=[];
let hp=100,maxHp=100,xp=0,level=1,gold=0,kills=0,dead=false,attackCd=0,heavyCd=0,dodgeT=0,invuln=0,healCd=0,camAngle=0,camAuto=0;
let move={x:0,y:0},enemies=[],effects=[],trees=[],lastToast=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mat(color,rough=.9){return new THREE.MeshStandardMaterial({color,roughness:rough});}
const materials={grass:mat('#6b9a68'),grass2:mat('#83ae72'),bark:mat('#74513b'),leaf:mat('#4e8555'),leaf2:mat('#77a95d'),stone:mat('#858d80'),stone2:mat('#a5a58f'),gold:mat('#e5bf69'),skin:mat('#e2b58a'),armor:mat('#385a55'),dark:mat('#243a36'),steel:mat('#b8c9c4',.42),enemy:mat('#7d514d'),bone:mat('#ded9bd'),eye:mat('#f3c66d'),flower:mat('#f0d18a')};
function mesh(geo,material,x,y,z,parent=scene){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function group(x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);return g;}
function box(parent,w,h,d,material,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z,parent);}
function sphere(parent,r,material,x,y,z,seg=10){return mesh(new THREE.SphereGeometry(r,seg,Math.max(6,seg-2)),material,x,y,z,parent);}
function cylinder(parent,rt,rb,h,material,x,y,z,n=8){return mesh(new THREE.CylinderGeometry(rt,rb,h,n),material,x,y,z,parent);}
function makeTree(x,z,scale=1){const g=group(x,0,z);cylinder(g,.23*scale,.35*scale,1.9*scale,materials.bark,0,.9*scale,0,7);for(let i=0;i<3;i++){const r=(1.05-i*.18)*scale;const c=mesh(new THREE.ConeGeometry(r,1.45*scale,7),i===1?materials.leaf2:materials.leaf,0,(1.65+i*.58)*scale,0,g);c.rotation.y=i*.7;}trees.push(g);}
function makeRuin(x,z){const g=group(x,0,z);for(let i=0;i<3;i++){const p=box(g,.45,2.7,.48,materials.stone,(i-1)*1.35,1.35,0);p.rotation.z=(i-1)*.04;}box(g,4.2,.45,.7,materials.stone2,0,2.8,0);box(g,4.2,.35,.65,materials.stone,-.1,3.18,0).rotation.z=.08;for(let i=0;i<5;i++){const r=mesh(new THREE.IcosahedronGeometry(.2+Math.random()*.25,0),materials.stone,x+(Math.random()-.5)*5,.15,z+(Math.random()-.5)*2);world.push(r);}return g;}
function buildWorld(){
scene=new THREE.Scene();scene.background=new THREE.Color('#a9d6d1');scene.fog=new THREE.Fog('#a9d6d1',22,64);
scene.add(new THREE.HemisphereLight('#e8f6ed','#53684c',2.0));
const sun=new THREE.DirectionalLight('#fff0cf',2.5);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);
renderer=new THREE.WebGLRenderer({antialias:Math.min(devicePixelRatio,1.5)>1,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;$('game').appendChild(renderer.domElement);
camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);clock=new THREE.Clock();
const ground=mesh(new THREE.PlaneGeometry(160,160,1,1),materials.grass,0,-.12,0);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
for(let i=0;i<140;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)<10)continue;makeTree(x,z,.65+Math.random()*.7);}
for(let i=0;i<50;i++){let x=(Math.random()-.5)*80,z=(Math.random()-.5)*80;if(Math.hypot(x,z)<8)continue;let rock=mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.45,0),Math.random()>.5?materials.stone:materials.stone2,x,.1,z);rock.rotation.set(Math.random(),Math.random(),Math.random());rock.scale.y=.55;world.push(rock);}
makeRuin(10,-13);makeRuin(-17,12);makeRuin(22,20);
for(let i=0;i<60;i++){const x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.hypot(x,z)<5)continue;const f=mesh(new THREE.ConeGeometry(.12,.3,5),materials.flower,x,.05,z);f.rotation.z=(Math.random()-.5)*.4;}
player=makeWarrior();spawnEnemy('wolf',5,-5);spawnEnemy('skeleton',-7,-10);spawnEnemy('wolf',-9,7);
}
function makeWarrior(){const g=group(0,0,0);const body=box(g,.72,1,.42,materials.armor,0,1.12,0);body.rotation.x=-.04;const chest=box(g,.78,.28,.46,materials.gold,0,1.42,-.02);const head=sphere(g,.29,materials.skin,0,1.9,0,12);const hair=sphere(g,.3,materials.dark,0,2.06,-.04,10);hair.scale.set(1,.52,1);const helmet=mesh(new THREE.ConeGeometry(.28,.42,6),materials.gold,0,2.27,0,g);helmet.rotation.z=.06;for(const s of [-1,1]){const leg=box(g,.25,.66,.28,materials.dark,s*.2,.42,0);leg.name='leg'+s;const boot=box(g,.3,.18,.38,materials.gold,s*.2,.12,.04);const arm=box(g,.23,.68,.25,materials.armor,s*.5,1.18,0);arm.rotation.z=s*.16;}const hilt=cylinder(g,.055,.055,.48,materials.gold,.58,1.05,-.02,6);hilt.rotation.z=-.9;sword=box(g,.11,.92,.08,materials.steel,.72,1.57,-.02);sword.rotation.z=-.38;const tip=mesh(new THREE.ConeGeometry(.08,.2,4),materials.steel,.88,2.07,-.02,g);tip.rotation.z=-.38;g.userData.sword=sword;return g;}
function makeEnemy(type,x,z){const g=group(x,0,z);g.userData.type=type;g.userData.hp=type==='wolf'?42:58;g.userData.maxHp=g.userData.hp;g.userData.cool=Math.random()+.5;g.userData.phase=Math.random()*6;g.userData.hitFlash=0;
if(type==='wolf'){const body=sphere(g,.48,materials.enemy,0,.62,0,10);body.scale.set(1.25,.72,.72);const head=sphere(g,.29,materials.enemy,0,.83,-.48,10);const snout=mesh(new THREE.ConeGeometry(.16,.4,5),materials.enemy,0,.78,-.76,g);snout.rotation.x=-Math.PI/2;for(let s of [-1,1]){const ear=mesh(new THREE.ConeGeometry(.1,.27,5),materials.enemy,s*.18,1.12,-.48,g);ear.rotation.z=s*.2;sphere(g,.045,materials.eye,s*.12,.9,-.71,7);for(let j=0;j<2;j++){const leg=box(g,.12,.38,.13,materials.enemy,s*.28,.25,(j===0?-.25:.25));leg.rotation.x=(j===0?-.12:.12);}}}
else{cylinder(g,.17,.22,.75,materials.bone,0,.8,0,7);sphere(g,.22,materials.bone,0,1.42,0,8);box(g,.08,.1,.04,materials.eye,-.08,1.44,-.19);box(g,.08,.1,.04,materials.eye,.08,1.44,-.19);for(let s of [-1,1]){box(g,.11,.65,.12,materials.bone,s*.3,.87,0).rotation.z=s*.2;box(g,.13,.55,.13,materials.bone,s*.14,.29,0);}}
const barbg=box(g,.85,.1,.08,mat('#302d2b'),0,2.02,0);const bar=box(g,.8,.065,.09,mat('#d85a4f'),0,2.03,.05);g.userData.hpBar=bar;g.userData.barBg=barbg;enemies.push(g);return g;}
function spawnEnemy(type,x,z){return makeEnemy(type,x,z);}
function toast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.opacity=0,1600);}
function updateHud(){$('hpFill').style.width=(hp/maxHp*100)+'%';$('xpFill').style.width=(xp/100*100)+'%';$('hpText').textContent=Math.ceil(hp)+' / '+maxHp+' صحة';$('level').textContent='المستوى '+level;$('gold').textContent=gold+' ذهب';$('questText').textContent='اهزم الوحوش القريبة ('+Math.min(kills,3)+'/3)'+(kills>=3?' ✓':'');}
function nearestEnemy(){let best=null,d=Infinity;for(const e of enemies){if(e.userData.hp<=0)continue;const n=e.position.distanceTo(player.position);if(n<d){best=e;d=n;}}return best&&d<3.2?best:null;}
function burst(pos,color='#ffe09a'){const g=group(pos.x,pos.y+1,pos.z);for(let i=0;i<7;i++){const p=mesh(new THREE.IcosahedronGeometry(.07,0),mat(color),0,0,0,g);p.userData.v=new THREE.Vector3((Math.random()-.5)*3,Math.random()*2,(Math.random()-.5)*3);}effects.push({g,t:.45});}
function attack(heavy=false){if(dead)return;let cd=heavy?heavyCd:attackCd;if(cd>0)return;if(heavy)heavyCd=1.15;else attackCd=.48;const target=nearestEnemy();const sword=player.userData.sword;sword.rotation.z=heavy?-.9:.65;setTimeout(()=>{if(sword)sword.rotation.z=-.38;},160);if(target){target.userData.hp-=heavy?35:20;target.userData.hitFlash=.2;target.position.add(new THREE.Vector3(player.position.x-target.position.x,0,player.position.z-target.position.z).normalize().multiplyScalar(-.35));burst(target.position,heavy?'#ffb84e':'#f9e8b0');toast(heavy?'ضربة ثقيلة!':'أصبت الوحش!');if(target.userData.hp<=0){target.userData.hp=0;kills++;xp+=heavy?24:18;gold+=8+Math.floor(Math.random()*8);if(xp>=100){xp-=100;level++;maxHp+=12;hp=maxHp;toast('ارتفع مستواك! المستوى '+level);}updateHud();setTimeout(()=>{scene.remove(target);enemies=enemies.filter(e=>e!==target);},180);if(kills>=3)toast('أحسنت! اكتملت مهمة الغابة');}}else toast('اقترب من الوحش أولًا');}
function doDodge(){if(dead||dodgeT>0)return;dodgeT=.42;invuln=.5;const dir=new THREE.Vector3(move.x,0,move.y);if(dir.length()<.1)dir.set(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);dir.normalize();player.position.add(dir.multiplyScalar(-1.8));player.position.x=clamp(player.position.x,-42,42);player.position.z=clamp(player.position.z,-42,42);}
function heal(){if(dead||healCd>0)return;if(hp>=maxHp){toast('صحتك ممتلئة');return;}healCd=7;hp=Math.min(maxHp,hp+35);burst(player.position,'#7ce4a0');updateHud();toast('استعدت 35 صحة');}
function update(dt,t){if(dead)return;attackCd=Math.max(0,attackCd-dt);heavyCd=Math.max(0,heavyCd-dt);dodgeT=Math.max(0,dodgeT-dt);invuln=Math.max(0,invuln-dt);healCd=Math.max(0,healCd-dt);
let speed=dodgeT>0?8:4.4;const vec=new THREE.Vector3(move.x,0,move.y);if(vec.length()>.05){vec.normalize();const angle=Math.atan2(vec.x,vec.z)+camAngle;const dx=Math.sin(angle),dz=Math.cos(angle);player.position.x+=dx*speed*dt;player.position.z+=dz*speed*dt;player.rotation.y=Math.atan2(dx,dz);}
player.position.x=clamp(player.position.x,-43,43);player.position.z=clamp(player.position.z,-43,43);player.position.y=0;
const camDist=7.5,camHeight=4.2;const targetAngle=player.rotation.y+camAngle;const desired=new THREE.Vector3(player.position.x-Math.sin(targetAngle)*camDist,camHeight,player.position.z-Math.cos(targetAngle)*camDist);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position.x,1.25,player.position.z);
for(const e of enemies){if(e.userData.hp<=0)continue;const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);e.userData.phase+=dt*4;e.position.y=Math.sin(e.userData.phase)*.025;if(d>1.45&&d<15){e.position.x+=dx/d*(e.userData.type==='wolf'?1.7:1.1)*dt;e.position.z+=dz/d*(e.userData.type==='wolf'?1.7:1.1)*dt;e.rotation.y=Math.atan2(dx,dz);}e.userData.cool-=dt;if(d<1.55&&e.userData.cool<=0&&invuln<=0){e.userData.cool=e.userData.type==='wolf'?1.35:1.8;hp=Math.max(0,hp-(e.userData.type==='wolf'?9:12));updateHud();toast('تلقيت ضربة!');if(hp<=0){dead=true;$('dead').style.display='flex';}}const ratio=e.userData.hp/e.userData.maxHp;e.userData.hpBar.scale.x=Math.max(.001,ratio);e.userData.hpBar.position.x=-(1-ratio)*.4;e.userData.hpBar.visible=ratio<1;e.userData.barBg.visible=ratio<1;}
for(let i=effects.length-1;i>=0;i--){const ef=effects[i];ef.t-=dt;for(const p of ef.g.children){p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=4*dt;}if(ef.t<=0){scene.remove(ef.g);effects.splice(i,1);}}
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt,clock.elapsedTime);renderer.render(scene,camera);}
function bindControls(){const joy=$('joystick'),stick=$('stick');let pointer=null,rect;
function setJoy(e){rect=joy.getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=rect.width*.32;const len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}move.x=dx/max;move.y=dy/max;stick.style.left=`calc(50% + ${dx}px)`;stick.style.top=`calc(50% + ${dy}px)`;}
joy.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;joy.setPointerCapture(pointer);setJoy(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e);});function release(e){if(e.pointerId!==pointer)return;pointer=null;move.x=move.y=0;stick.style.left='50%';stick.style.top='50%';}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack(false)});$('heavy').addEventListener('pointerdown',e=>{e.preventDefault();attack(true)});$('dodge').addEventListener('pointerdown',e=>{e.preventDefault();doDodge()});$('heal').addEventListener('pointerdown',e=>{e.preventDefault();heal()});
$('cam').addEventListener('click',()=>{camAngle+=Math.PI/4;toast('تم تدوير الكاميرا');});$('restart').addEventListener('click',()=>location.reload());
let hideHint=setTimeout(()=>$('hint').style.opacity=0,6500);
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move.y=-1;if(e.key==='ArrowDown'||e.key==='s')move.y=1;if(e.key==='ArrowLeft'||e.key==='a')move.x=-1;if(e.key==='ArrowRight'||e.key==='d')move.x=1;if(e.key===' ' )attack(false);if(e.key==='Shift')doDodge();});addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','w','s'].includes(e.key))move.y=0;if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move.x=0;});
}
try{buildWorld();bindControls();updateHud();loading.style.display='none';hud.style.display='block';animate();}catch(e){$('loadmsg').textContent='حدث خطأ أثناء تجهيز العالم. حدّث الصفحة وجرب مرة أخرى.';console.error(e);}
addEventListener('resize',()=>{if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body></html>
